name: Coletar dados da estação

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 min (o GitHub pode atrasar ou pular execuções)
  workflow_dispatch:

# Evita duas coletas ao mesmo tempo
concurrency:
  group: coletar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run coletar
        env:
          FIREBASE_CHAVE_JSON: ${{ secrets.FIREBASE_CHAVE_JSON }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
